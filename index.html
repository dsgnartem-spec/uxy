<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uxy — Learn UI/UX design by fixing real mistakes</title>
<meta name="description" content="Short quizzes on real app screens. Spot the mistake, learn the rule. Start free on iPhone and Android.">
<meta property="og:title" content="Uxy — Learn UI/UX design by fixing real mistakes">
<meta property="og:description" content="Short quizzes on real app screens. Start free on iPhone and Android.">
<meta property="og:image" content="https://dsgnartem-spec.github.io/uxy/icon.png">
<meta property="og:url" content="https://dsgnartem-spec.github.io/uxy/">
<meta name="twitter:card" content="summary">
<meta name="apple-itunes-app" content="app-id=6783110192">
<meta name="theme-color" content="#F6F6F9">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --bg:#F6F6F9; --card:#FFFFFF; --t1:#242429; --t2:#6E6E80; --blue:#0098FE; --line:#E5E5EA; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px calc(40px + env(safe-area-inset-bottom)); text-align:center; }
  .icon { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 24px rgba(36,36,41,.12); }
  h1 { font-size:28px; line-height:34px; font-weight:700; letter-spacing:-.5px; margin:24px 0 8px; max-width:420px; }
  p.sub { font-size:17px; line-height:24px; color:var(--t2); margin:0 0 28px; max-width:380px; text-wrap:balance; }
  h1 { text-wrap:balance; }
  .btns { display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; }
  a.btn { display:flex; align-items:center; justify-content:center; gap:10px; height:56px; border-radius:16px;
    font-size:17px; font-weight:600; text-decoration:none; }
  a.btn svg { width:22px; height:22px; flex:none; }
  a.primary { background:var(--blue); color:#fff; }
  a.secondary { background:var(--card); color:var(--t1); border:1px solid var(--line); }
  .status { font-size:15px; color:var(--t2); margin:0 0 20px; min-height:20px; }
  .hint { font-size:14px; line-height:20px; color:var(--t2); margin:20px 0 0; max-width:340px; display:none; }
  .qr { display:none; margin-top:32px; }
  .qrbox { margin:0 auto; width:160px; height:160px; background:#fff; padding:10px; border-radius:16px; border:1px solid var(--line); }
  .qrbox { display:block; image-rendering:pixelated; }
  .qr p { font-size:14px; color:var(--t2); margin:10px 0 0; }
  footer { font-size:13px; color:var(--t2); margin-top:40px; }
  footer a { color:var(--t2); }
  @media (min-width:700px) { .btns { flex-direction:row; max-width:520px; } a.btn { flex:1; } .qr { display:block; } }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Uxy app icon" width="96" height="96">
  <h1>Learn UI/UX design by fixing real mistakes</h1>
  <p class="sub">Short quizzes on real app screens. Start free.</p>
  <p class="status" id="status"></p>
  <div class="btns">
    <a class="btn primary" id="ios" href="https://apps.apple.com/app/id6783110192">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.02-1.5-2.62-1.7-3.19-1.72-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.75 2.2 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.71.71 2.88.69 1.19-.02 1.94-1.08 2.67-2.14.84-1.23 1.19-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5zM14.18 6.13c.61-.74 1.02-1.76.91-2.78-.88.04-1.94.59-2.57 1.32-.56.65-1.06 1.69-.93 2.69.98.08 1.98-.5 2.59-1.23z"/></svg>
      App Store
    </a>
    <a class="btn secondary" id="android" href="https://play.google.com/store/apps/details?id=com.sam.wootz.designmind">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D7FE" d="M3.6 2.3c-.25.27-.4.68-.4 1.2v17c0 .52.15.93.4 1.2l9.4-9.7-9.4-9.7z"/><path fill="#00F076" d="M16.1 15.1 13 12l-9.4 9.7c.35.37.92.41 1.57.05l11-6.3-.07-.35z"/><path fill="#FFC900" d="M20.3 10.7 16.2 8.4 13 12l3.1 3.1 4.2-2.4c1.2-.69 1.2-1.81 0-2z"/><path fill="#FF3A44" d="M16.2 8.4 5.17 2.25C4.52 1.9 3.95 1.93 3.6 2.3L13 12l3.2-3.6z"/></svg>
      Google Play
    </a>
  </div>
  <p class="hint" id="hint">Store didn't open? Tap <b>⋯</b> in the top corner and choose <b>Open in browser</b>, then tap the button again.</p>
  <div class="qr" id="qr">
    <img class="qrbox" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACMAAAAjAQAAAAA2oo70AAAA3UlEQVR42gHSAC3/Af8AAADhAwEztwlAAb7WRBexBOQJ89AAAgAGNAAAAgAqbgAAAhwnHAcAAyHwEfSAAP+f/z/gAb7Owj7UAuGqGewAAltFxkIAAwZHRYTQBBnmVO/xBPOumlXcA0kxODzsAdc3WC4MAgE0LP0AAuX1b9sABC09ANi0AxZTQeTcAim983EAAvkz8qLAALCXGNpgALU2/vDgAzBjV/AvAnXS7DfAAwE395n7AL7S/zggBOQYZkkfAgAZM9IAAgDx8d+AAL78MnLgAyHbMgOtAf8AAADhLyFQz2gA8wkAAAAASUVORK5CYII=" alt="QR code to download Uxy">
    <p>Scan with your phone camera</p>
  </div>
  <footer><a href="https://cybercatofsummer.github.io/uxy-privacy-policy">Privacy</a></footer>
</main>
<script>
(function () {
  var APP_ID_IOS = '6783110192';
  var PKG = 'com.sam.wootz.designmind';
  var q = new URLSearchParams(location.search);
  var src = (q.get('src') || 'bio').replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || 'bio';
  var noRedirect = q.has('stay');

  // Google Play install referrer → Firebase picks it up as the campaign of the install.
  var ref = 'utm_source=instagram&utm_medium=social&utm_campaign=' + src;
  var playWeb = 'https://play.google.com/store/apps/details?id=' + PKG + '&referrer=' + encodeURIComponent(ref);
  var playMarket = 'market://details?id=' + PKG + '&referrer=' + encodeURIComponent(ref);
  var playIntent = 'intent://details?id=' + PKG + '&referrer=' + encodeURIComponent(ref) +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(playWeb) + ';end';
  // App Store campaign token (ct) shows up in App Store Connect once a provider token (pt) is added.
  var appStore = 'https://apps.apple.com/app/id' + APP_ID_IOS + '?ct=' + encodeURIComponent(src);

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var inApp = /Instagram|FBAN|FBAV|TikTok|musical_ly|Bytedance|Snapchat|Twitter|Line\//i.test(ua);

  var iosBtn = document.getElementById('ios');
  var andBtn = document.getElementById('android');
  var status = document.getElementById('status');
  var hint = document.getElementById('hint');
  iosBtn.href = appStore;
  andBtn.href = isAndroid ? playIntent : playWeb;

  if (isAndroid) {
    // Show Google Play first on Android.
    andBtn.className = 'btn primary'; iosBtn.className = 'btn secondary';
    andBtn.parentNode.insertBefore(andBtn, iosBtn);
  }

  if (noRedirect) return;
  if (isIOS) {
    status.textContent = 'Opening the App Store…';
    location.replace(appStore);
  } else if (isAndroid) {
    status.textContent = 'Opening Google Play…';
    // Chrome opens https Play links in the Play app; in-app browsers (Instagram) often can't, the intent scheme can.
    location.href = inApp ? playIntent : playWeb;
    setTimeout(function () { if (!document.hidden) { status.textContent = ''; if (inApp) hint.style.display = 'block'; } }, 1800);
  }
})();
</script>
</body>
</html>
